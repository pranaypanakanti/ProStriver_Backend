name: Build & Deploy

on:
  push:
    branches: [ main ]

jobs:
  deploy-api:
    name: Deploy API to EC2
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: pranaypanakanti/prostriver:latest

      - name: Copy compose & Alloy config to EC2
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "docker-compose.api.yml,config.alloy"
          target: "~/prostriver"

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -e
            cd ~/prostriver

            test -f docker-compose.api.yml || { echo "❌ docker-compose.api.yml missing"; exit 1; }
            test -f config.alloy || { echo "❌ config.alloy missing"; exit 1; }

            # Capture running image digest BEFORE deploy
            OLD=$(docker inspect prostriver-api --format '{{.Image}}' 2>/dev/null || echo none)

            docker compose -f docker-compose.api.yml pull
            docker compose -f docker-compose.api.yml up -d --force-recreate

            # Verify the API container is actually running the NEW image
            sleep 5
            NEW=$(docker inspect prostriver-api --format '{{.Image}}')
            echo "old image: $OLD"
            echo "new image: $NEW"
            [ "$OLD" != "$NEW" ] || echo "⚠️ WARNING: image did not change — deploy may be a no-op"

            # Fail loudly if either container isn't up
            docker ps --filter name=prostriver-api --filter status=running | grep prostriver-api || { echo "❌ prostriver-api not running after deploy"; exit 1; }
            docker ps --filter name=prostriver-alloy --filter status=running | grep prostriver-alloy || { echo "❌ prostriver-alloy not running after deploy"; exit 1; }

            docker image prune -f

  deploy-worker:
    name: Deploy Worker to Heroku
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push to Heroku (builds via heroku.yml)
        env:
          HEROKU_API_KEY: ${{ secrets.HEROKU_API_KEY }}
        run: |
          git push https://heroku:$HEROKU_API_KEY@git.heroku.com/prostriver-worker.git HEAD:main -f